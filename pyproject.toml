[project]
name = "ltlf2dfa"
version = "1.0.2"
description = "From LTLf/PPLTL to Deterministic Finite-state Automata (DFA)"
readme = "README.md"
requires-python = ">=3.11"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Francesco Fuggitti" },
]
keywords = [
    "linear-time temporal logic on finite traces",
    "pure-past linear temporal logic",
    "deterministic finite-state automata",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "click>=8.1.3,<9",
    "lark>=1.1.5,<2",
    "sympy>=1.12,<2",
]

[project.scripts]
ltlf2dfa = "ltlf2dfa.__main__:cli"

[project.urls]
Homepage = "https://whitemech.github.io/ltlf2dfa"
Repository = "https://github.com/whitemech/ltlf2dfa"
Documentation = "https://whitemech.github.io/ltlf2dfa"
Issues = "https://github.com/whitemech/ltlf2dfa/issues"

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ltlf2dfa"
module-root = ""

[dependency-groups]
dev = [
    "markdown-include",
    "mkdocs",
    "mkdocs-material",
    "mypy",
    "pre-commit>=4.6.1",
    "pymdown-extensions",
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--doctest-modules",
    "--cov=ltlf2dfa",
    "--cov-report=term-missing",
    "--cov-report=xml",
]

[tool.coverage.run]
branch = true
source = ["ltlf2dfa"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    "scripts/whitelist.py",
    "tests/fixtures",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",
]

[tool.mypy]
python_version = "3.11"
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "lark.*",
    "sympy.*",
]
ignore_missing_imports = true
